name: Update Vendor Registries

on:
  schedule:
    # Run at 00:00 UTC on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-registries:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Registries
        run: python scripts/compile_registries.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signatures/threat_signatures_light.json signatures/registry_full.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated monthly vendor registry update [skip ci]" && git push)
